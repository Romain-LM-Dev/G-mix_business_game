# Gabarits de carte : la génération ne crée jamais de géométrie, elle choisit des zones de ce fichier et
# des assets du catalogue (ai/assets.yaml) pour chacune. Lu par l'API (gmix.game.world) et envoyé tel quel
# au client Godot avec le lobby.
#
# Repère Godot : 1 unité = 1 m, Y vers le haut. Une zone est une parcelle rectangulaire :
#   position [x, z] = centre ; size [largeur, profondeur] ; facing = rotation Y en degrés
#   (0 : la façade des assets regarde +Z, vers la route ; 180 : regarde -Z).
# categories : catégories d'assets proposées à la génération ; defaults : choix sûr si l'IA échoue.
# 8 zones au plus (schéma business_game : world.zones.maxItems).

version: 1

templates:
  parc_activites:
    name: "Parc d'activités"
    description: "Zone d'activités périurbaine traversée par une route, quatre parcelles de chaque côté."
    ground: [220, 120]
    spawn: [0, 0, 2]
    roads:
      - { from: [-100, 0], to: [100, 0] }
    zones:
      - id: z_siege
        name: "Siège social"
        purpose: "Bureaux de la direction, réunions et écran des indicateurs"
        position: [-75, -30]
        size: [46, 36]
        facing: 0
        categories: [building, furniture, interactive]
        defaults: [bld_office_hq, prop_kpi_screen, prop_meeting_table, furn_plant]
      - id: z_entrepot
        name: "Entrepôt"
        purpose: "Stockage, préparation de commandes et gestion des stocks"
        position: [-25, -30]
        size: [46, 36]
        facing: 0
        categories: [building, industrial, vehicle]
        defaults: [bld_warehouse, prop_pallet_rack, prop_pallet_stack, veh_forklift, prop_box_large]
      - id: z_usine
        name: "Usine"
        purpose: "Production, machines et flux de fabrication"
        position: [25, -30]
        size: [46, 36]
        facing: 0
        categories: [building, industrial, vehicle]
        defaults: [bld_factory_plant, prop_conveyor, prop_robot_arm, prop_cnc_machine, prop_andon_light]
      - id: z_fournisseur
        name: "Fournisseur"
        purpose: "Site d'un fournisseur : approvisionnements, délais et négociation des achats"
        position: [75, -30]
        size: [46, 36]
        facing: 0
        categories: [building, industrial, vehicle]
        defaults: [bld_factory_workshop, prop_shipping_container, prop_pallet, veh_flatbed_truck]
      - id: z_quai
        name: "Quai de transport"
        purpose: "Expéditions, réceptions et transporteurs"
        position: [-75, 30]
        size: [46, 36]
        facing: 180
        categories: [building, vehicle, industrial, road]
        defaults: [bld_loading_dock, veh_box_truck, prop_shipping_container_blue, prop_pallet, prop_traffic_cone]
      - id: z_plateforme
        name: "Plateforme logistique"
        purpose: "Distribution, cross-docking et flux vers les clients"
        position: [-25, 30]
        size: [46, 36]
        facing: 180
        categories: [building, industrial, vehicle]
        defaults: [bld_distribution_center, prop_scanner_gate, prop_conveyor_corner, veh_van]
      - id: z_banque
        name: "Agence bancaire"
        purpose: "Financement, trésorerie et relation bancaire"
        position: [25, 30]
        size: [46, 36]
        facing: 180
        categories: [building, furniture]
        defaults: [bld_bank_branch, prop_desk_computer, furn_plant]
      - id: z_commerce
        name: "Commerce"
        purpose: "Ventes, clients et service après-vente"
        position: [75, 30]
        size: [46, 36]
        facing: 180
        categories: [building, furniture, vehicle]
        defaults: [bld_shop_front, prop_box_small, veh_van]
