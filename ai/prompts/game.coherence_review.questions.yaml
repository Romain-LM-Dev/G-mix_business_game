# Questions fermées de la tâche game.coherence_review (étape 7 du pipeline, docs/ai-runtime.md).
# Pour chaque option générée : une question par effet, posée sur l'explication de l'option (`state` = libellé +
# explication). Si l'explication dit le contraire de l'effet, l'effet est inversé : l'explication est ce que les
# joueurs lisent au débrief. `{kpi}` est remplacé par le nom de l'indicateur.
version: 2

# Probabilité minimale du choix pour corriger un effet. Mesuré le 2026-10-22 : la revue globale par décision
# (v1 : « les effets suivent-ils l'explication ? ») ne signalait aucun des effets inversés d'une génération ;
# la question par indicateur est plus simple. Seuil non mesuré : créer ai/evals/game.coherence_review.jsonl.
thresholds:
  direction: 0.6

questions:
  direction:
    type: choice
    instructions: "D'après l'explication, comment évolue l'indicateur « {kpi} » si l'on choisit cette option ?"
    criteria:
      hausse: L'explication dit que cet indicateur augmente, monte ou progresse
      baisse: L'explication dit que cet indicateur diminue, baisse ou se réduit
      non_dit: L'explication ne dit rien du sens de cet indicateur
