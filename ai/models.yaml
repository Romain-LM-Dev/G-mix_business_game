# Catalogue des modèles et des tâches des agents IA runtime (Ollama).
#
# RÈGLE : le code demande une TÂCHE (ex. "npc.dialogue"), jamais un modèle.
# Changer de modèle, de budget ou de température = modifier ce fichier (validé par les tests).
#
# Profil matériel actuel : RTX 3060 Laptop 6 Go VRAM / 16 Go RAM.
# => un seul modèle "main" (~5 Go) tient en VRAM ; Godot en 3D consomme aussi de la VRAM.
# => les petits modèles (nano, embed, decide-fast) peuvent cohabiter.
#
# Champs d'une tâche : model, fallback, output (text|json|decision|embedding), schema (ai/schemas),
# options Ollama (num_predict, temperature…), max_input_tokens, rag, cache, stream, think.
#
# num_ctx est FIXÉ PAR MODÈLE, jamais par tâche : mesuré sur ce poste, alterner 512 / 4096 sur
# qwen2.5:1.5b force un rechargement à chaque appel (~7 s au lieu de quelques centaines de ms).
# Le coût en tokens se pilote avec max_input_tokens (entrée) et num_predict (sortie).

version: 1
keep_alive: "10m"

models:
  # --- Décision : questions fermées (choice / noul / score), API /v1/systemone (format Jev) ---
  decide-fast:
    name: "tev1:0.8b"
    kind: decision
    vram_gb: 1.0
    required: false
    notes: >-
      Mesuré en français (ai/evals/player.intent.jsonl) : intention 93 %, injections 5/6 au seuil 0,7,
      ~0,1 s/message, 0,8 Go de VRAM : tient en mémoire à côté du modèle de dialogue. Exige Ollama >= 0.40.4.
  decide:
    name: "tev1:4b"
    kind: decision
    vram_gb: 4.6
    required: false
    notes: "Mesuré en français : intention 100 %, ~0,9 s, 4,6 Go de VRAM. Hors temps réel sur ce poste (revue, notation)."

  # --- Génération de texte ---
  nano:
    name: "qwen2.5:1.5b"
    kind: chat
    vram_gb: 1.2
    num_ctx: 4096
    notes: "Textes très courts : répliques d'ambiance, reformulation de requête RAG."
  small:
    name: "qwen2.5:3b"
    kind: chat
    vram_gb: 2.3
    num_ctx: 6144
    notes: "Dialogues PNJ avec RAG, remplissage JSON d'une section. Candidat d'upgrade : qwen3.5:4b."
  main:
    name: "qwen2.5:7b"
    kind: chat
    vram_gb: 4.9
    num_ctx: 6144
    notes: >-
      Conception du scénario et débrief. Mesuré le 2026-10-22 (RTX 3060 6 Go, modèle seul en mémoire) :
      num_ctx 8192 -> 21 % sur CPU, 16 tok/s ; 6144 -> 18 % sur CPU, 21,5 tok/s. Candidat : qwen3.5:9b
      (6,6 Go : déborde davantage, acceptable pour la génération asynchrone, à mesurer).

  # --- Embeddings ---
  embed:
    name: "embeddinggemma"
    kind: embedding
    dims: 768 # = EMBED_DIM de backend/gmix/db/models.py (testé)
    vram_gb: 0.7
    query_prefix: "task: search result | query: "
    document_prefix: "title: {title} | text: "
    notes: "Multilingue, 2k tokens de contexte. Préfixes recommandés par Google pour EmbeddingGemma."

tasks:
  # --- Diagnostic -------------------------------------------------------------------------------
  system.ping:
    description: "Test de la chaîne IA (worker de diagnostic)."
    model: nano
    output: text
    options: { num_predict: 8, temperature: 0 }
    max_input_tokens: 100
  system.ping.decision:
    description: "Test du modèle de décision (repli : émulation par nano)."
    model: decide-fast
    fallback: nano
    output: decision

  # --- Génération d'un business game (pipeline formateur, asynchrone via Kafka) ---------------------
  game.brief_check:
    description: >-
      Vérifie que la demande du formateur est exploitable et cohérente avec le domaine choisi,
      AVANT de dépenser des milliers de tokens de génération.
    model: decide-fast
    fallback: nano
    output: decision
  game.outline:
    description: >-
      Plan du business game : objectifs pédagogiques, entreprise, rôles, KPI, phases.
      Ancré sur le corpus RAG du domaine (sources citées).
    model: main
    output: json
    schema: "business_game#/$defs/outline"
    options: { num_predict: 2048, temperature: 0.4 }
    max_input_tokens: 4000
    rag: { top_k: 6, max_context_tokens: 2500 }
  # Toutes les étapes génératives sur `main` : mesuré le 2026-10-22, qwen2.5:3b produisait des options vagues et
  # répétées d'une phase à l'autre, sans arbitrage ; sur ce poste il n'était pas plus rapide (~20 tok/s) et chaque
  # bascule 7b <-> 3b coûtait 17 à 32 s de rechargement. Génération complète : 6 à 9 min, asynchrone.
  game.phase_detail:
    description: "Décisions (options + effets chiffrés) et aléas d'UNE phase, à partir du plan validé."
    model: main
    fallback: small
    output: json
    schema: "business_game#/$defs/phase_detail"
    options: { num_predict: 1536, temperature: 0.3 }
    max_input_tokens: 4200
    rag: { top_k: 4, max_context_tokens: 1500 }
  game.npcs:
    description: "PNJ experts (rôle, personnalité, périmètre de connaissance, objectifs de dialogue)."
    model: main
    fallback: small
    output: json
    schema: "business_game#/$defs/npcs_block"
    options: { num_predict: 1024, temperature: 0.5 }
    max_input_tokens: 2800
  game.asset_mapping:
    description: >-
      Associe chaque zone du monde à des assets du catalogue. Le schéma est restreint à l'exécution
      (enum des ids candidats pré-filtrés par similarité vectorielle) : impossible d'inventer un asset.
    model: main
    fallback: small
    output: json
    schema: "asset_selection"
    cache: true
    options: { num_predict: 600, temperature: 0 }
    max_input_tokens: 3200
  game.debrief:
    description: "Enseignements clés et questions de débrief, à partir des objectifs, KPI et explications des options."
    model: main
    fallback: small
    output: json
    schema: "business_game#/$defs/debrief"
    options: { num_predict: 1024, temperature: 0.3 }
    max_input_tokens: 3500
  game.coherence_review:
    description: >-
      Grille de contrôle qualité du scénario assemblé : cohérence des chiffres, réalisme métier,
      alignement objectifs / KPI / décisions. Questions fermées notées (score), pas de prose.
    model: decide
    fallback: main
    output: decision

  # --- Agents en jeu (côté joueurs, latence visible) ---------------------------------------------
  player.intent:
    description: "Route le message d'un joueur : question métier, décision, social, hors-sujet, tentative d'injection."
    model: decide-fast
    fallback: nano
    output: decision
  npc.dialogue:
    description: "Réplique d'un PNJ expert, ancrée sur le RAG du domaine et l'état de la partie (streaming)."
    model: small
    output: text
    stream: true
    options: { num_predict: 220, temperature: 0.6 }
    max_input_tokens: 3000
    rag: { top_k: 3, max_context_tokens: 900 }
  npc.bark:
    description: "Phrase d'ambiance courte d'un PNJ, sans RAG."
    model: nano
    output: text
    options: { num_predict: 40, temperature: 0.8 }
    max_input_tokens: 300
  rag.query_rewrite:
    description: "Reformule la question du joueur en requête autonome (résout « et pour ça ? »)."
    model: nano
    output: text
    cache: true
    options: { num_predict: 48, temperature: 0 }
    max_input_tokens: 600
  rag.embed:
    description: "Embeddings des passages (ingestion) et des requêtes (recherche)."
    model: embed
    output: embedding

  # --- Évaluation et débrief -------------------------------------------------------------------
  answer.grading:
    description: "Note la réponse d'un joueur à une question de débrief selon une grille (score)."
    model: decide
    fallback: small
    output: decision
  debrief.feedback:
    description: "Retour personnalisé de fin de partie à partir des KPI et des décisions, avec sources."
    model: main
    output: text
    options: { num_predict: 700, temperature: 0.4 }
    max_input_tokens: 5000
    rag: { top_k: 4, max_context_tokens: 1500 }
